name: Build CV (Simple)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  repository_dispatch:
    types: [yaml-updated]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install Python dependencies
      run: pip install pyyaml

    - name: Validate YAML data
      run: python3 yaml2csv.py --owner siddhss5 --repo siddhss5.github.io --branch main --output-dir data/ --validate

    - name: Generate CSV files from YAML
      run: python3 yaml2csv.py --owner siddhss5 --repo siddhss5.github.io --branch main --output-dir data/

    - name: Verify CSV files were generated
      run: |
        echo "Checking for required CSV files..."
        for csv in students-phd students-ms postdocs awards press; do
          if [ ! -f "data/${csv}.csv" ]; then
            echo "❌ Missing data/${csv}.csv"
            exit 1
          fi
          echo "✅ Found data/${csv}.csv"
        done
        echo "All required CSV files present"
      
    - name: Compile LaTeX document
      uses: xu-cheng/latex-action@v4
      with:
        root_file: sidd-cv.tex
        latexmk_use_xelatex: false
        latexmk_shell_escape: false
      
    - name: Upload PDF
      uses: actions/upload-artifact@v4
      with:
        name: cv-pdf
        path: sidd-cv.pdf

    - name: Check PDF changes
      id: pdf_diff
      run: |
        if git diff --quiet sidd-cv.pdf 2>/dev/null; then
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "📄 CV PDF unchanged"
        else
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "📝 CV PDF updated in this build"
          # Show file size for reference
          ls -lh sidd-cv.pdf | awk '{print "   Size: " $5}'
        fi

    - name: Commit and push PDF
      # Only from main. A pull_request build checks out a detached merge ref, so
      # `git push` there fails with "You are not currently on a branch" - and a
      # PR has no business committing to main anyway. The PDF is still built and
      # uploaded as an artifact above, which is what a PR wants.
      if: steps.pdf_diff.outputs.changed == 'true' && github.ref == 'refs/heads/main'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add sidd-cv.pdf
        if git diff --staged --quiet; then
          echo "No changes to PDF"
        else
          git commit -m "Auto-update CV PDF [skip ci]"
          git push
        fi
    - name: Tell the website to rebuild
      # The CV is already committed by the time this runs, and the website
      # fetches it on its next build regardless, so a missing or expired PAT
      # should not fail the pipeline - it shows as a failed step instead.
      continue-on-error: true
      if: steps.pdf_diff.outputs.changed == 'true' && github.ref == 'refs/heads/main'
      uses: peter-evans/repository-dispatch@v3
      with:
        # Fine-grained PAT with Contents: write on siddhss5/siddhss5.github.io.
        # Without it this step fails and the CV still lands here, just not there.
        token: ${{ secrets.SITE_REPO_PAT }}
        repository: siddhss5/siddhss5.github.io
        event-type: cv-updated
        client-payload: '{"sha": "${{ github.sha }}"}'

