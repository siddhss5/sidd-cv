name: Sync Data and Rebuild

# Refresh what this repo copies from elsewhere - the .bib files from
# personalrobotics/pubs, and the CSVs generated from the website's YAML - then
# rebuild the CV if any of it changed.
#
# Runs daily, so a change that nothing dispatches about is picked up within a
# day rather than waiting for someone to push here. The two repository_dispatch
# events (yaml-updated from the website, cv-updated to it) make the common cases
# immediate; this is the backstop.

on:
  schedule:
    - cron: '0 9 * * *'  # Every day at 9am UTC
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync-and-rebuild:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Fetch latest publications
      run: |
        cd pubs
        for file in siddpubs-journal.bib siddpubs-conf.bib siddpubs-misc.bib; do
          echo "📥 Fetching ${file}..."
          curl -sf "https://raw.githubusercontent.com/personalrobotics/pubs/master/${file}" -o "${file}"
          echo "✅ Updated ${file}"
        done
        cd ..

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: pip install pyyaml

    - name: Generate CSV files
      run: python3 yaml2csv.py --owner siddhss5 --repo siddhss5.github.io --branch main --output-dir data/

    - name: Check for changes
      id: changes
      run: |
        # Both sources matter: the .bib files carry publications and paper
        # awards, and the CSVs carry everything from the website's YAML. Only
        # the bibs were checked before, so a change to people.yaml, awards.yaml
        # or press.yaml alone rebuilt nothing.
        if git diff --quiet pubs/*.bib data/*.csv; then
          echo "changed=false" >> $GITHUB_OUTPUT
          echo "📄 No publication or data updates"
        else
          echo "changed=true" >> $GITHUB_OUTPUT
          echo "📝 Sources updated"
          git diff --stat pubs/*.bib data/*.csv
        fi

    - name: Compile CV
      if: steps.changes.outputs.changed == 'true'
      uses: xu-cheng/latex-action@v4
      with:
        root_file: sidd-cv.tex
        latexmk_use_xelatex: false
        latexmk_shell_escape: false

    - name: Commit and push changes
      if: steps.changes.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add pubs/*.bib data/*.csv sidd-cv.pdf
        git commit -m "Sync data from pubs and the website [skip ci]"
        git push

    - name: Tell the website to rebuild
      # The CV is already committed by the time this runs, and the website
      # fetches it on its next build regardless, so a missing or expired PAT
      # should not fail the pipeline - it shows as a failed step instead.
      continue-on-error: true
      if: steps.changes.outputs.changed == 'true'
      uses: peter-evans/repository-dispatch@v3
      with:
        # Fine-grained PAT with Contents: write on siddhss5/siddhss5.github.io.
        token: ${{ secrets.SITE_REPO_PAT }}
        repository: siddhss5/siddhss5.github.io
        event-type: cv-updated
        client-payload: '{"sha": "${{ github.sha }}"}'
